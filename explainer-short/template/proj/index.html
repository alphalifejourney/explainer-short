// ---------- timeline helpers ----------
function land(id, t) {
  const o = NODES[id];
  tl.to(o.card, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: 'power3.out' }, t);
  tl.to(o.cast, { opacity: 1, duration: 0.6, ease: 'power2.out' }, t + 0.1);
  tl.to(o.ph, { opacity: 0, duration: 0.3, ease: 'power1.in' }, t);
  tl.to([o.chip, o.lbl], { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out', stagger: 0.07 }, t + 0.12);
}
function pulse(id, t, soft) {
  const o = NODES[id];
  tl.set(o.ring, { opacity: 0.95, scale: 0.985 }, t);
  tl.to(o.ring, { opacity: 0, scale: 1.05, duration: 0.7, ease: 'power2.out' }, t);
  if (!soft) {
    tl.to(o.card, { scale: 1.025, duration: 0.1, ease: 'power2.out' }, t);
    tl.to(o.card, { scale: 1, duration: 0.5, ease: 'back.out(3)' }, t + 0.1);
  }
  tl.to(o.chip, { backgroundColor: GREEN, color: '#FFFFFF', duration: 0.12, ease: 'power2.out' }, t);
  tl.to(o.cast, { backgroundColor: 'rgba(40,128,52,0.34)', duration: 0.15, ease: 'power2.out' }, t);
  tl.to(o.cast, { backgroundColor: 'rgba(32,57,83,0.16)', duration: 1.0, ease: 'power2.inOut' }, t + 0.35);
  tl.to(o.chip, { backgroundColor: TINT, color: GREEN, duration: 0.5, ease: 'power2.inOut' }, t + 0.4);
}
function drawWire(id, t, dur, ease) {
  const w = WIRES[id];
  tl.to([w.under, w.track], { attr: { 'stroke-dashoffset': 0 }, duration: dur, ease: ease || 'power2.inOut' }, t);
  tl.to(w.p0, { attr: { opacity: 1 }, duration: 0.15 }, t);
  tl.to(w.p1, { attr: { opacity: 1 }, duration: 0.15 }, t + dur * 0.8);
}
function packet(id, t, dur, opts) {
  opts = opts || {};
  const w = WIRES[id];
  const dot = el(world, {}, 'pkt' + (opts.small ? ' sm' : ''));
  const pr = { u: 0 };
  const TR = opts.small ? 0 : 220;
  tl.to(pr, { u: 1, duration: dur, ease: opts.ease || 'power2.inOut', onUpdate: () => {
    const u = pr.u, on = u > 0 && u < 1;
    const l = u * w.L, p = w.at(l);
    dot.style.transform = `translate(${p.x}px, ${p.y}px)`;
    dot.style.opacity = on ? (opts.small ? Math.min(1, u * 8, (1 - u) * 8) * 0.95 : 1) : 0;
    if (TR) { const tlen = Math.min(TR, l); w.trail.setAttribute('stroke-dasharray', `${tlen} ${w.L * 2}`);
      w.trail.setAttribute('stroke-dashoffset', -(l - tlen)); w.trail.setAttribute('opacity', on ? 0.35 : 0); }
    if (opts.lit) w.lit.setAttribute('stroke-dashoffset', w.L - l);
  } }, t);
  if (opts.lit) { tl.to(w.lit, { attr: { opacity: 0.32 }, duration: 0.8, ease: 'power2.inOut' }, t + dur + 0.05); }
  if (!opts.small) { tl.to(w.p1, { attr: { stroke: GREEN, fill: GREEN }, duration: 0.15 }, t + dur - 0.05); }
}
function poolTo(id, t, dur) { const n = N[id]; tl.to(pool, { x: n.cx - 700, y: n.cy - 550, duration: dur, ease: 'power2.inOut' }, t); }
function step(i, t) {
  if (i === 0) { tl.to(ctr, { opacity: 1, duration: 0.3, ease: 'power2.out' }, t); }
  else { tl.to(nums[i - 1], { y: -70, duration: 0.4, ease: 'power3.inOut' }, t); tl.to(nums[i], { y: 0, duration: 0.4, ease: 'power3.inOut' }, t); }
  tl.to(dotFill[i], { scaleX: 1, duration: 0.5, ease: 'power3.out' }, t + 0.05);
}

tl.to(looks, { y: 0, duration: 0.3, ease: 'power2.inOut', stagger: 0.05 }, C5.style - 0.1);
tl.set(lookRing, { opacity: 1, scale: 1.08 }, C5.style);
tl.to(lookRing, { scale: 1, duration: 0.4, ease: 'back.out(3)' }, C5.style);
tl.to([looks[0], looks[2], looks[3]], { opacity: 0.35, duration: 0.3, ease: 'power2.out' }, C5.style + 0.05);
const qstep = Math.max(0.12, (C5.questions + 0.3 - C5.answer) / 5);
qdots.forEach((d, i) => {
  tl.to(d, { backgroundColor: GREEN, duration: 0.12, ease: 'power2.out' }, C5.answer + i * qstep);
  tl.to(d, { scale: 1.25, duration: 0.1, ease: 'power2.out' }, C5.answer + i * qstep);
  tl.to(d, { scale: 1, duration: 0.3, ease: 'back.out(3)' }, C5.answer + i * qstep + 0.1);
});
tl.to(picker, { opacity: 0, y: -30, duration: 0.3, ease: 'power2.in' }, C5.renders - 0.3);
tl.to(play, { opacity: 1, scale: 1, duration: 0.25, ease: 'back.out(2)' }, C5.renders - 0.15);
tl.to(play, { scale: 0.84, duration: 0.08, ease: 'power2.in' }, C5.renders + 0.15);
tl.to(play, { scale: 1.25, opacity: 0, duration: 0.25, ease: 'power2.in' }, C5.renders + 0.23);
minis.forEach((b, i) => tl.to(b, { opacity: 1, scale: 1, y: 0, duration: 0.35, ease: 'back.out(2)' }, C5.renders + 0.35 + i * 0.16));
gsap.set(minisvg, { opacity: 0 });
tl.to(minisvg, { opacity: 1, duration: 0.3, ease: 'power2.out' }, C5.renders + 0.35);
const MP0 = C5.renders + 0.6, MP1 = C5.d + 0.6;
tl.to(vfill, { width: 972, duration: C5.e + 0.1 - C5.renders, ease: 'power1.inOut' }, C5.renders + 0.2);
tl.to(file, { opacity: 1, x: 0, duration: 0.45, ease: 'power3.out' }, C5.e - 0.2);
tl.to(rcheck, { opacity: 1, scale: 1, duration: 0.45, ease: 'back.out(2.5)' }, C5.e);

// CTA: pull out, sweep; "free" lands the title, "link" lands the address, "screen" nudges it
const E = C5.d;
tl.to(ctr, { opacity: 0, duration: 0.3, ease: 'power2.in' }, E);
['c1', 'c2', 'c3', 'c4'].forEach((id, i) => { const w = WIRES[id];
  tl.to(w.lit, { attr: { opacity: 1 }, duration: 0.15, ease: 'power2.out' }, E + 0.7 + i * 0.1);
  tl.to(w.lit, { attr: { opacity: 0.45 }, duration: 0.7, ease: 'power2.inOut' }, E + 0.9 + i * 0.1); });
['clone', 'copy', 'check', 'prompt', 'render'].forEach((id, i) => pulse(id, E + 0.7 + i * 0.1));
tl.to(e1, { y: 0, duration: 0.6, ease: 'power3.out' }, CT.free - 0.2);
tl.to(url, { opacity: 1, y: 0, duration: 0.5, ease: 'power3.out' }, CT.link - 0.25);
tl.to(url, { scale: 1.04, duration: 0.25, ease: 'power2.out' }, CT.screen);
tl.to(url, { scale: 1, duration: 0.5, ease: 'back.out(3)' }, CT.screen + 0.25);
[['c1', 0], ['c2', 0.15], ['c3', 0.3], ['c4', 0.45]].forEach(([id, o]) => {
  for (let t = E + 1.1 + o; t + 0.6 < DUR; t += 0.5) packet(id, t, id === 'c2' || id === 'c4' ? 0.9 : 0.5, { small: true, ease: 'none' });
});

// ---------- camera: pure function of time. It settles on a card at TM.x.a and leaves at TM.x.d ----------
const card = (id, s, sy) => ({ x: N[id].cx, y: N[id].cy + (960 - (sy || 860)) / s, s });
const WIDE = { x: 1100, y: 1235, s: 0.5 };
const K = [
  { t: 0.0, ...WIDE },
  { t: H.d, x: 1100, y: 1235, s: 0.54, e: 'sine.out' },
  { t: C1.a, ...card('clone', 1.2), e: 'expo.inOut' },
  { t: C1.d, ...card('clone', 1.25), e: 'none' },
  { t: C2.a, ...card('copy', 1.2), e: 'power3.inOut' },
  { t: C2.d, ...card('copy', 1.25), e: 'none' },
  { t: C3.a, ...card('check', 1.2), e: 'power3.inOut', dip: 0.18 },
  { t: C3.d, ...card('check', 1.25), e: 'none' },
  { t: C4.a, ...card('prompt', 1.2), e: 'power3.inOut' },
  { t: C4.d, ...card('prompt', 1.25), e: 'none' },
  { t: C5.a, ...card('render', 0.84, 1010), e: 'power3.inOut' },
  { t: C5.d, ...card('render', 0.88, 1010), e: 'none' },
  { t: C5.d + 0.95, ...WIDE, e: 'expo.inOut' },
  { t: DUR, x: 1100, y: 1235, s: 0.55, e: 'none' },
];
K.forEach(k => { if (k.e) k.ef = gsap.parseEase(k.e); });
function cam(t) {
  if (t <= K[0].t) return K[0];
  for (let i = 1; i < K.length; i++) {
    const a = K[i - 1], b = K[i];
    if (t <= b.t) {
      const u = (t - a.t) / (b.t - a.t), e = b.ef(u);
      let s = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * e);
      if (b.dip) s *= 1 - b.dip * Math.sin(Math.PI * e);
      return { x: a.x + (b.x - a.x) * e, y: a.y + (b.y - a.y) * e, s };
    }
  }
  return K[K.length - 1];
}

const clock = { t: 0 };
function frame(t) {
  const c = cam(t), c0 = cam(Math.max(0, t - 1 / 30));
  const s = c.s;
  world.style.transform = `translate(${540 - c.x * s}px, ${960 - c.y * s}px) scale(${s})`;
  // lean with camera speed; land tilted at 20 deg, tip back during the pull out
  const vx = (c.x - c0.x) * s, vy = (c.y - c0.y) * s;
  const ry = Math.max(-6, Math.min(6, vx * 0.06)), rx = Math.max(-5, Math.min(5, -vy * 0.06));
  const cl = v => Math.max(0, Math.min(1, v));
  const uo = cl(t / TM.clone.a), eo = Math.pow(1 - uo, 3);
  const up = cl((t - TM.render.d) / 2.4), bp = Math.pow(Math.sin(Math.PI * up), 1.3) * (up > 0 && up < 1 ? 1 : 0);
  const RX = 20 * eo + 18 * bp, RZ = -4 * eo - 3 * bp;
  stage.style.transform = `perspective(2600px) rotateX(${rx + RX}deg) rotateY(${ry}deg) rotateZ(${RZ}deg)`;
  fog.style.opacity = Math.min(0.5, RX / 40);
  const g = 38 * Math.pow(s, 0.3);
  grid.style.backgroundSize = `${g}px ${g}px`;
  const gx = ((1200 - c.x * s * 0.8) % g + g) % g, gy = ((1400 - c.y * s * 0.8) % g + g) % g;
  grid.style.backgroundPosition = `${gx}px ${gy}px`;
  pmark.firstChild.style.transform = `rotate(${t * 14}deg)`;
  // mini player: the packet runs the little circuit, lights it on the first pass, then keeps looping
  const mt = t - MP0, MPD = 1.9;
  if (mt > 0 && t < MP1) {
    const pass = mt / MPD, u = pass % 1, eu = 0.5 - 0.5 * Math.cos(Math.PI * u), p = mAt(eu);
    mdot.style.transform = `translate(${p.x}px, ${p.y}px)`; mdot.style.opacity = Math.min(1, u * 10, (1 - u) * 10);
    mlit.setAttribute('stroke-dashoffset', pass >= 1 ? 0 : mL - eu * mL);
  } else { mdot.style.opacity = 0; mlit.setAttribute('stroke-dashoffset', mt > 0 ? 0 : mL); }
}
tl.to(clock, { t: DUR, duration: DUR, ease: 'none', onUpdate: () => frame(clock.t) }, 0);
frame(0);
tl.seek(0);
})();
</script>
